name: CI

on:
  push:
    branches: [main, master, ver2]
  pull_request:
    branches: [main, master, ver2]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -count=1 ./pkg/cli/... ./internal/export/... ./internal/storage/...
